[project]
name = "jalrekha"
version = "0.1.0"
description = "JalRekha MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "pydantic",
    "pillow",
    "python-multipart",
    "aiofiles",
    "httpx",
    "orjson",
    "faster-whisper",
    "lxml",
    "litert-lm-api==0.11.0",
    "opencv-python-headless==5.0.0.93",
    "numpy>=1.26,<3",
    "boto3>=1.35",
    "anthropic>=1.0",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "trio"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
